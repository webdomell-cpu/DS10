<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Signage CMS — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0d0d14;color:#f0f0f8;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(124,111,255,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(34,211,164,.05) 0%,transparent 50%)}
.card{position:relative;width:420px;background:#13131f;border:1px solid #2a2a40;border-radius:20px;padding:40px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#7c6fff,#22d3a4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.logo-text{font-size:20px;font-weight:700;color:#f0f0f8}
.logo-sub{font-size:12px;color:#5a5a78;font-weight:400;margin-top:1px}
h1{font-size:22px;font-weight:700;margin-bottom:6px;text-align:center}
.subtitle{font-size:13px;color:#7070a0;text-align:center;margin-bottom:28px}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:#9090b0;margin-bottom:6px}
.input-wrap{position:relative}
input{width:100%;background:#0d0d14;border:1px solid #2a2a40;border-radius:10px;padding:11px 40px 11px 14px;color:#f0f0f8;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
input:focus{border-color:#7c6fff}
input::placeholder{color:#4a4a6a}
.input-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#4a4a6a;font-size:14px;cursor:pointer}
.btn{width:100%;background:linear-gradient(135deg,#7c6fff,#6355e8);color:#fff;border:none;border-radius:10px;padding:13px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:linear-gradient(135deg,#9587ff,#7c6fff);transform:translateY(-1px);box-shadow:0 8px 24px rgba(124,111,255,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.2);color:#f43f5e;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;align-items:center;gap:8px}
.error.show{display:flex}
.footer{margin-top:24px;padding-top:20px;border-top:1px solid #1e1e2e;text-align:center;font-size:11px;color:#4a4a6a}
.role-hint{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.role-tag{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;background:#1e1e2e;border:1px solid #2a2a40;color:#7070a0}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-tv"></i></div>
    <div><div class="logo-text">SignageCMS</div><div class="logo-sub">Digital Signage Platform v9.0</div></div>
  </div>
  <h1>Willkommen zurück</h1>
  <p class="subtitle">Melde dich mit deinem Account an</p>

  <div class="error" id="errorMsg"><i class="fas fa-circle-xmark"></i><span id="errorTxt"></span></div>

  <div class="form-group">
    <label for="email">E-Mail-Adresse</label>
    <div class="input-wrap">
      <input type="email" id="email" placeholder="name@example.com" autocomplete="email">
      <i class="fas fa-envelope input-icon"></i>
    </div>
  </div>
  <div class="form-group">
    <label for="password">Passwort</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <i class="fas fa-eye input-icon" id="togglePw" style="cursor:pointer"></i>
    </div>
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">
    <i class="fas fa-arrow-right-to-bracket"></i> Anmelden
  </button>

  <div class="role-hint">
    <span class="role-tag">SuperAdmin</span>
    <span class="role-tag">Tenant-Admin</span>
    <span class="role-tag">Editor</span>
    <span class="role-tag">Viewer</span>
  </div>

  <div class="footer">Digital Signage CMS v9.0 &bull; Multi-Tenant SaaS</div>
</div>

<script>
document.getElementById('togglePw').addEventListener('click', () => {
    const inp = document.getElementById('password');
    const icon = document.getElementById('togglePw');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.className = `fas fa-${inp.type === 'password' ? 'eye' : 'eye-slash'} input-icon`;
});

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });

async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');
    const errTxt = document.getElementById('errorTxt');

    if (!email || !password) {
        errTxt.textContent = 'Bitte Email und Passwort eingeben';
        err.classList.add('show'); return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Anmelden…';
    err.classList.remove('show');

    try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Anmeldung fehlgeschlagen');

        localStorage.setItem('cms_token', data.token);
        localStorage.setItem('cms_user', JSON.stringify(data.user));

        // Redirect based on role
        if (data.user.role === 'superadmin') {
            window.location.href = '/superadmin/';
        } else {
            window.location.href = '/admin/';
        }
    } catch (e) {
        errTxt.textContent = e.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Anmelden';
    }
}

// Redirect if already logged in
const token = localStorage.getItem('cms_token');
if (token) {
    const user = JSON.parse(localStorage.getItem('cms_user') || '{}');
    if (user.role === 'superadmin') window.location.href = '/superadmin/';
    else window.location.href = '/admin/';
}
</script>
</body>
</html>
